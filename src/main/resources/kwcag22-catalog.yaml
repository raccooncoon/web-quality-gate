      limit: "검증 속성·메시지 요소 존재는 탐지 가능(보조 신호). 메시지 문구의 명확성·실제 접근성은 수동 확인 필요."

  - no: 31
    code: "3.3.3"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "접근 가능한 인증"
    criteria: "인지 기능 테스트(퍼즐 풀이 등)에만 의존하지 않는 인증 수단을 제공"
    resolver: { type: probe, rules: [auth] }
    guide:
      what: "로그인·본인확인 단계에서 이미지 퍼즐·계산 등 인지 테스트만 존재하는지 스크린샷으로 확인합니다."
      why: "인지장애·시각장애 사용자는 이미지 기반 캡차 등 인지 테스트를 수행하기 어렵습니다."
      basis: "KWCAG 2.2 3.3.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "이미지 캡차 외 음성 캡차, 이메일/문자 인증 등 대체 인증 수단을 함께 제공."
      limit: "인증 방식의 구성은 자동 판별이 어려워 화면 캡처를 근거로 수동 확인합니다."

