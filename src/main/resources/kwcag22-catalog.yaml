items:
  - no: 1
    code: "1.1.1"
    category: accessibility
    siClassification: auto
    automation: auto
    title: "적절한 대체 텍스트 제공"
    criteria: "의미 있는 이미지에 적절한 대체텍스트, 장식 이미지는 빈 alt"
    resolver: { type: axe, rules: [image-alt, area-alt, svg-img-alt, role-img-alt, object-alt, input-image-alt] }
    guide:
      what: "이미지 등 비텍스트 콘텐츠에 대체 텍스트(alt)가 있는지 검사합니다."
      why: "스크린리더 사용자는 alt 텍스트로 이미지의 의미를 전달받습니다."
      basis: "KWCAG 2.2 1.1.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "의미 있는 이미지: alt=\"내용 설명\". 장식 이미지: alt=\"\"(빈 값). 예) <img src=\"logo.png\" alt=\"회사 로고\">"
      limit: "alt 존재는 자동 검출. 대체텍스트의 '적절성'은 수동 확인 권장."

  - no: 2
    code: "2.4.2"
    category: accessibility
    siClassification: auto
    automation: auto
    title: "제목 제공"
    criteria: "페이지·프레임·콘텐츠 블록에 명확하고 적절한 제목을 제공"
    resolver: { type: axe, rules: [document-title, frame-title] }
    guide:
      what: "문서 <title>, 프레임 title 속성 등 제목 요소가 존재하고 비어있지 않은지 검사합니다."
      why: "스크린리더 사용자는 페이지 제목으로 현재 위치와 내용을 먼저 파악합니다."
      basis: "KWCAG 2.2 2.4.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "각 페이지에 고유하고 내용을 설명하는 <title>을 지정하고, iframe에는 title 속성을 부여."
      limit: "제목 존재·비어있음 여부는 자동 검출. 제목의 '적절성'(내용 대표성)은 수동 확인 권장."

  - no: 3
    code: "3.1.1"
    category: accessibility
    siClassification: auto
    automation: auto
    title: "기본 언어 표시"
    criteria: "웹페이지에서 사용하는 기본 언어를 명시"
    resolver: { type: axe, rules: [html-has-lang, html-lang-valid, valid-lang] }
    guide:
      what: "<html lang> 속성의 존재와 유효한 언어 코드 여부를 검사합니다."
      why: "스크린리더는 lang 속성을 기준으로 음성 합성 언어를 전환합니다. 누락 시 잘못된 발음으로 읽습니다."
      basis: "KWCAG 2.2 3.1.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "<html lang=\"ko\">와 같이 페이지 전체 언어를 BCP47 형식으로 명시."
      limit: "속성 존재·형식 유효성은 자동 검출. 실제 본문 언어와의 일치 여부는 수동 확인 권장."

  - no: 4
    code: "3.2.1"
    category: accessibility
    siClassification: auto
    automation: screen
    title: "사용자 요구에 따른 실행"
    criteria: "사용자가 의도하지 않은 컨텍스트 변화(새 창, 초점 이동 등)가 자동으로 발생하지 않아야 함"
    resolver: { type: probe, rules: [new-window] }
    guide:
      what: "target=\"_blank\", window.open 호출, select onchange 자동 이동 등 사용자 동의 없는 컨텍스트 변경 패턴을 탐지합니다."
      why: "예고 없이 새 창이 열리거나 페이지가 이동하면 스크린리더·저시력 사용자는 상황 변화를 인지하지 못해 혼란을 겪습니다."
      basis: "KWCAG 2.2 3.2.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "새 창으로 열리는 링크에는 안내 문구/aria-label을 추가하고, select 변경 시 자동 이동 대신 확인 버튼을 제공."
      limit: "정적 마크업 패턴은 자동 탐지. 실제 사용자 조작에 따른 동적 컨텍스트 변경은 수동 확인 권장."

  - no: 5
    code: "3.3.2"
    category: accessibility
    siClassification: auto
    automation: auto
    title: "레이블 제공"
    criteria: "사용자 입력에는 대응하는 레이블을 제공"
    resolver: { type: axe, rules: [label, select-name, button-name, aria-input-field-name] }
    guide:
      what: "입력 필드·버튼·select 등 폼 컨트롤에 프로그램적으로 연결된 레이블(label/aria-label 등)이 있는지 검사합니다."
      why: "스크린리더 사용자는 레이블이 없으면 입력 필드의 용도를 알 수 없습니다."
      basis: "KWCAG 2.2 3.3.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "<label for=\"id\">문구</label>로 명시적 연결하거나 aria-label/aria-labelledby를 사용."
      limit: "레이블 존재·연결관계는 자동 검출. 레이블 문구의 의미적 적절성은 수동 확인 권장."

  - no: 6
    code: "4.1.1"
    category: accessibility
    siClassification: auto
    automation: auto
    title: "마크업 오류 방지"
    criteria: "마크업 요소의 열고 닫음, 중첩, 속성 선언을 문법에 맞게 작성"
    resolver: { type: markup, rules: [] }
    guide:
      what: "vnu.jar(Nu HTML Checker)로 HTML 문법 오류(중첩 오류, 미종료 태그, 잘못된 속성 등)를 검사합니다."
      why: "마크업 오류는 스크린리더 등 보조기술이 콘텐츠 구조를 잘못 해석하게 만듭니다."
      basis: "KWCAG 2.2 4.1.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "vnu 리포트의 오류 위치를 확인해 태그 중첩·닫힘·속성 문법을 표준에 맞게 수정."
      limit: "MPA는 서버 응답 원본, SPA는 렌더링된 DOM 스냅샷을 검사(런타임 이후 변경분은 스냅샷 시점 기준)."

  - no: 8
    code: "1.2.1"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "자막 제공"
    criteria: "멀티미디어 콘텐츠에는 자막(또는 대본·수어)을 제공"
    resolver: { type: probe, rules: [media-captions] }
    guide:
      what: "<video>/<audio> 요소에 <track kind=\"captions\"> 자막 트랙이 있는지 탐지합니다."
      why: "청각장애인은 자막이 없으면 영상 콘텐츠의 음성 정보를 전혀 알 수 없습니다."
      basis: "KWCAG 2.2 1.2.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "영상에 <track kind=\"captions\" srclang=\"ko\" src=\"captions.vtt\">를 추가하고, 필요 시 대본·수어 링크를 제공."
      limit: "track 요소 존재 여부만 자동 탐지. 자막 내용의 정확성·동기화는 수동 확인 필요."

  - no: 9
    code: "1.3.1"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "표의 구성"
    criteria: "표는 헤더와 데이터 셀의 연관성을 지켜 이해하기 쉽게 구성"
    resolver: { type: axe, rules: [td-headers-attr, th-has-data-cells, scope-attr-valid, table-fake-caption] }
    guide:
      what: "<table>의 <th scope>, headers/id 연관, caption 사용 등 구조적 마크업을 검사합니다."
      why: "스크린리더는 표를 셀 단위로 읽어주므로 헤더-데이터 연관이 없으면 표의 의미를 파악하기 어렵습니다."
      basis: "KWCAG 2.2 1.3.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "단순 표는 <th scope=\"col\">/<th scope=\"row\">, 복잡한 표는 headers/id 속성으로 연관을 지정하고 <caption>으로 표 제목을 제공."
      limit: "마크업 구조 오류는 자동 검출. 표 레이아웃 남용(레이아웃 목적 표) 여부는 수동 확인 권장."

  - no: 10
    code: "1.3.2"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "콘텐츠의 선형 구조"
    criteria: "콘텐츠를 선형화해도 의미와 순서가 유지되어야 함"
    resolver: { type: probe, rules: [linear-order] }
    guide:
      what: "CSS를 제거한 상태의 DOM 순서를 스냅샷으로 추출해, 시각적 배치 순서와 소스 순서가 크게 다른지 참고 자료로 제공합니다."
      why: "스크린리더·읽기모드 사용자는 소스 순서대로 콘텐츠를 인식하므로, 시각 순서와 다르면 내용이 뒤엉켜 전달됩니다."
      basis: "KWCAG 2.2 1.3.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "CSS(float/position/order)로 시각 순서만 바꾸지 말고, 논리적으로 의미 있는 순서로 마크업을 작성."
      limit: "DOM 순서 스냅샷은 자동 추출되나, 순서의 의미적 타당성 판정은 평가자가 수동으로 확인해야 합니다."

  - no: 11
    code: "1.3.3"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "명확한 지시사항 제공"
    criteria: "지시사항은 모양·크기·위치·색·소리 등 감각적 특성만으로 제공하지 않아야 함"
    resolver: { type: none }
    guide:
      what: "\"오른쪽 빨간 버튼을 누르세요\"처럼 감각적 특성에만 의존하는 지시문 여부를 스크린샷과 본문 텍스트로 확인합니다."
      why: "저시력·색각이상·시각장애 사용자는 위치·색·모양 정보를 인지하지 못해 지시를 따를 수 없습니다."
      basis: "KWCAG 2.2 1.3.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "지시문에 텍스트 레이블을 함께 제공. 예) \"오른쪽 빨간 [제출] 버튼을 누르세요\"처럼 이름을 병기."
      limit: "자동 판정 불가. 캡처된 스크린샷과 본문을 근거로 평가자가 수동으로 판단합니다."

  - no: 12
    code: "1.4.1"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "색에 무관한 인식"
    criteria: "콘텐츠는 색상 정보 없이도 인식 가능해야 함"
    resolver: { type: axe, rules: [link-in-text-block] }
    guide:
      what: "본문 속 링크가 색상만으로 구분되지 않고 밑줄 등 추가 시각 단서가 있는지 검사합니다."
      why: "색각이상 사용자는 색상 차이만으로는 링크와 일반 텍스트를 구분하지 못합니다."
      basis: "KWCAG 2.2 1.4.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "링크에 밑줄·아이콘 등 색 이외의 구분 수단을 추가. 예) text-decoration: underline."
      limit: "본문 링크 스타일은 자동 검출. 차트·그래프 등 색상 의존 콘텐츠는 스크린샷 기반 수동 확인 필요."

  - no: 13
    code: "1.4.2"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "자동 재생 금지"
    criteria: "자동으로 재생되는 소리가 있으면 안 되며, 불가피할 경우 즉시 정지 수단을 제공"
    resolver: { type: axe, rules: [no-autoplay-audio] }
    guide:
      what: "audio/video의 autoplay 속성과 axe no-autoplay-audio 규칙으로 자동재생 여부를 검사합니다."
      why: "예기치 못한 소리는 스크린리더 음성 안내를 덮어 사용자가 화면 낭독을 들을 수 없게 만듭니다."
      basis: "KWCAG 2.2 1.4.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "autoplay 속성을 제거하거나, 재생 시 즉시 접근 가능한 정지/음소거 컨트롤을 제공."
      limit: "autoplay 속성·axe 규칙 기반 자동 검출. 사용자 상호작용 이후 재생되는 소리는 probe로 보조 확인."

  - no: 7
    code: "1.4.3"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "텍스트 콘텐츠의 명도 대비"
    criteria: "일반 텍스트 4.5:1 이상, 큰 텍스트 3:1 이상"
    resolver: { type: axe, rules: [color-contrast] }
    guide:
      what: "텍스트와 배경색의 명암 대비를 검사합니다."
      why: "저시력·색각 이상 사용자가 글을 읽으려면 충분한 대비가 필요합니다."
      basis: "KWCAG 2.2 1.4.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "명도비 4.5:1 이상(큰 텍스트 3:1). 예) #767676 on #ffffff = 4.54:1 ✓"
      limit: "자동 검출. 배경 이미지·그라디언트 위 텍스트는 수동 확인 권장."

  - no: 14
    code: "1.4.4"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "콘텐츠 간의 구분"
    criteria: "전경색과 배경색이 시각적으로 구분되도록 제공"
    resolver: { type: none }
    guide:
      what: "텍스트가 아닌 콘텐츠 요소(아이콘, 버튼 테두리, 구획선 등)가 배경과 시각적으로 구분되는지 스크린샷으로 확인합니다."
      why: "저시력 사용자는 요소 간 경계가 흐리면 콘텐츠 영역을 구분하지 못합니다."
      basis: "KWCAG 2.2 1.4.4 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "버튼·입력창 등에 테두리, 그림자, 배경색 대비를 부여해 영역을 시각적으로 구분."
      limit: "비텍스트 대비는 자동 판정 도구의 한계로 캡처된 스크린샷을 근거로 수동 확인합니다."

  - no: 15
    code: "2.1.1"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "키보드 사용 보장"
    criteria: "모든 기능을 키보드만으로 사용할 수 있어야 함"
    resolver: { type: probe, rules: [keyboard-operable] }
    guide:
      what: "onclick만 있고 keydown/keypress가 없는 비-포커서블 요소, tabindex=-1 남용 등 마우스 전용 패턴을 탐지합니다."
      why: "지체장애·시각장애 사용자는 마우스를 사용할 수 없어 키보드만으로 모든 기능에 접근해야 합니다."
      basis: "KWCAG 2.2 2.1.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "클릭 핸들러가 있는 커스텀 컨트롤에는 tabindex=\"0\"과 keydown(Enter/Space) 핸들러를 함께 구현하거나 button/a 요소를 사용."
      limit: "정적 패턴(핸들러·속성)은 자동 탐지. 실제 Tab 순회로 전체 기능 도달 여부는 수동 확인 권장."

  - no: 16
    code: "2.1.2"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "초점 이동과 표시"
    criteria: "키보드 초점은 논리적으로 이동하고 시각적으로 표시되어야 함"
    resolver: { type: axe, rules: [focus-order-semantics] }
    guide:
      what: "포커스 가능 요소의 시맨틱과 tabindex 값을 검사하고, outline:none 등 :focus-visible 스타일 제거 여부를 탐지합니다."
      why: "초점 표시가 없으면 키보드 사용자는 현재 위치를 알 수 없고, 순서가 뒤틀리면 탐색이 혼란스럽습니다."
      basis: "KWCAG 2.2 2.1.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "outline:none 사용을 피하고 :focus-visible 스타일을 명확히 제공. tabindex는 자연스러운 DOM 순서를 따르도록 지양."
      limit: "정적 스타일·tabindex는 자동 검출. 실제 Tab 이동 순서의 논리성은 수동 확인 권장."

  - no: 17
    code: "2.1.3"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "조작 가능(타깃 크기)"
    criteria: "사용자 인터페이스 구성요소는 조작 가능한 최소 크기(예: 24×24px 이상)를 확보"
    resolver: { type: axe, rules: [target-size] }
    guide:
      what: "버튼·링크 등 클릭 가능한 요소의 렌더링 크기가 최소 타깃 크기 기준을 충족하는지 검사합니다."
      why: "손 떨림·저시력 사용자는 작은 터치 영역을 정확히 조작하기 어렵습니다."
      basis: "KWCAG 2.2 2.1.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "클릭 가능 요소의 크기를 최소 24x24px 이상으로 확보하거나 충분한 여백(패딩)을 추가."
      limit: "렌더링된 요소 크기는 자동 측정. 겹친 요소·오탐 여부는 수동 확인 권장."

  - no: 18
    code: "2.1.4"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "문자 단축키"
    criteria: "한 문자 단축키는 오동작 방지 수단(끄기·재설정·특정 포커스 시에만 동작)을 제공"
    resolver: { type: probe, rules: [accesskey] }
    guide:
      what: "accesskey 속성 사용 여부와 개수를 탐지해 단일 문자 단축키 존재를 스크리닝합니다."
      why: "단일 문자 단축키는 음성인식 사용자의 오동작을 유발하거나, 다른 보조기술 단축키와 충돌할 수 있습니다."
      basis: "KWCAG 2.2 2.1.4 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "단일 문자 단축키 사용 시 끄기/재정의 기능을 제공하거나 특정 컨트롤에 포커스가 있을 때만 활성화."
      limit: "accesskey 속성 존재는 자동 탐지(보조 신호). 스크립트 기반 단축키와 오동작 방지 수단 여부는 수동 확인 필요."

  - no: 19
    code: "2.2.1"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "응답시간 조절"
    criteria: "시간제한이 있는 콘텐츠는 응답시간을 조절할 수 있는 수단을 제공"
    resolver: { type: probe, rules: [meta-refresh] }
    guide:
      what: "<meta http-equiv=\"refresh\">, setTimeout 기반 자동 리다이렉트·세션 만료 타이머 패턴을 탐지합니다."
      why: "인지·지체장애 사용자는 정해진 시간 내 반응하지 못해 콘텐츠에 접근하지 못할 수 있습니다."
      basis: "KWCAG 2.2 2.2.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "meta refresh 대신 사용자 조작 기반 이동으로 대체하거나, 시간 연장/해제 옵션을 제공."
      limit: "정적 meta 태그는 자동 탐지. 스크립트 기반 동적 타이머의 실제 동작은 수동 확인 권장."

  - no: 20
    code: "2.2.2"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "정지 기능 제공"
    criteria: "자동으로 변경되는 콘텐츠(캐러셀, 애니메이션 등)는 정지 기능을 제공"
    resolver: { type: probe, rules: [auto-animation] }
    guide:
      what: "자동 재생 캐러셀, 무한 반복 CSS 애니메이션 등에 정지/일시정지 컨트롤이 있는지 탐지합니다."
      why: "움직이는 콘텐츠는 인지장애·주의력 저하 사용자의 집중을 방해하고, 저시력 사용자는 내용을 읽기 전에 넘어갈 수 있습니다."
      basis: "KWCAG 2.2 2.2.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "캐러셀·슬라이드에 일시정지/정지 버튼을 추가하고, 5초 이상 지속되는 자동 애니메이션은 제어 수단을 제공."
      limit: "자동 재생 요소의 존재는 탐지 가능. 정지 버튼의 실제 동작 여부는 수동 확인 권장."

  - no: 21
    code: "2.3.1"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "깜빡임과 번쩍임 사용 제한"
    criteria: "초당 3~50회 주기로 깜빡이거나 번쩍이는 콘텐츠를 제공하지 않아야 함"
    resolver: { type: probe, rules: [blink-flash] }
    guide:
      what: "<blink>/<marquee> 요소, 고빈도 CSS 애니메이션(짧은 duration 반복) 패턴을 탐지합니다."
      why: "광과민성 발작이 있는 사용자에게 특정 주파수의 점멸은 발작을 유발할 수 있습니다."
      basis: "KWCAG 2.2 2.3.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "<blink>/<marquee> 사용을 금지하고, 애니메이션 주기를 초당 3회 미만으로 조정하거나 점멸 효과 자체를 제거."
      limit: "요소·애니메이션 패턴은 자동 탐지. 실제 점멸 주파수·강도의 위험 여부는 수동 확인 권장."

  - no: 22
    code: "2.4.1"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "반복 영역 건너뛰기"
    criteria: "반복되는 콘텐츠 영역(네비게이션 등)은 건너뛸 수 있는 수단을 제공"
    resolver: { type: axe, rules: [bypass] }
    guide:
      what: "skip-link(본문 바로가기) 존재, 랜드마크/헤딩 구조를 통한 우회 가능성을 검사합니다."
      why: "스크린리더·키보드 사용자는 매 페이지 동일한 메뉴를 반복해서 듣거나 Tab으로 지나쳐야 하는 불편을 겪습니다."
      basis: "KWCAG 2.2 2.4.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "페이지 최상단에 \"본문 바로가기\" 링크를 제공하고 실제 포커스 이동이 되는지 확인."
      limit: "링크 존재는 자동 검출. 클릭 시 실제 포커스 이동(skip-link 실동작)은 probe로 보조 검증하되 최종 확인은 수동 권장."

  - no: 23
    code: "2.4.3"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "적절한 링크 텍스트"
    criteria: "링크 텍스트만으로 링크의 용도나 목적을 이해할 수 있어야 함"
    resolver: { type: axe, rules: [link-name] }
    guide:
      what: "링크의 접근 가능한 이름(텍스트/aria-label 등)이 비어있거나 \"여기\", \"더보기\" 같은 모호한 텍스트인지 검사합니다."
      why: "스크린리더 사용자는 링크만 모아서 탐색하는 경우가 많아, 텍스트가 모호하면 목적지를 알 수 없습니다."
      basis: "KWCAG 2.2 2.4.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "\"자세히 보기\" 대신 \"2026년 채용공고 자세히 보기\"처럼 목적을 담은 링크 텍스트를 사용."
      limit: "빈 링크명은 자동 검출. 텍스트의 의미적 명확성(모호한 표현)은 수동 확인 권장."

  - no: 24
    code: "2.4.4"
    category: accessibility
    siClassification: manual
    automation: na
    title: "고정된 참조 위치 제공"
    criteria: "전자출판 문서 등에서 페이지·문단 등 위치 참조 정보를 고정적으로 제공"
    resolver: { type: none }
    guide:
      what: "전자출판(EPUB 등) 문서에 적용되는 항목으로, 일반 웹 콘텐츠에는 해당하는 위치 참조 요소가 없는지 확인합니다."
      why: "전자출판 콘텐츠 사용자는 고정된 위치 참조(페이지 번호 등)로 인용·탐색을 합니다. 일반 웹은 대상이 아닙니다."
      basis: "KWCAG 2.2 2.4.4 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "웹 콘텐츠 자체에는 조치가 불필요. 전자출판 파일을 별도 제공하는 경우에만 고정 위치 참조자를 부여."
      limit: "웹 기본 검사 대상에서 해당없음(N/A)으로 분류되어 자동/수동 판정을 수행하지 않습니다."

  - no: 25
    code: "2.5.1"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "포인터 궤적(단일 포인터 대체)"
    criteria: "드래그·스와이프·핀치 등 경로/다중 포인터 제스처는 단순 누르기(단일 포인터)로도 조작 가능해야 함 (WCAG 2.5.1 Pointer Gestures)"
    resolver: { type: probe, rules: [pointer-gesture] }
