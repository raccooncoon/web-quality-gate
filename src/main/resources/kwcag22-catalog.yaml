      basis: "KWCAG 2.2 3.2.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "고객센터·도움말 링크를 공통 헤더/푸터에 배치해 모든 페이지에서 동일한 순서로 노출."
      limit: "여러 페이지 배치 비교는 자동화에 한계가 있어 스크린샷 기반 수동 확인이 필요합니다."

  - no: 30
    code: "3.3.1"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "오류 정정"
    criteria: "입력 오류를 사용자가 인지하고 정정할 수 있는 방법을 제공"
