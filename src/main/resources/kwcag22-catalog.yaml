    code: "3.3.4"
    category: accessibility
    siClassification: manual
    automation: screen
    title: "반복 입력 정보"
    criteria: "반복적으로 입력해야 하는 정보는 자동완성 등으로 재입력 부담을 줄여야 함"
    resolver: { type: axe, rules: [autocomplete-valid] }
    guide:
      what: "이름·주소·이메일 등 입력 필드에 유효한 autocomplete 속성 값이 지정되어 있는지 검사합니다."
      why: "지체장애·인지장애 사용자는 동일 정보를 반복 입력하는 것이 큰 부담이 됩니다."
      basis: "KWCAG 2.2 3.3.4 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "표준 필드에 autocomplete 속성을 부여. 예) <input type=\"email\" autocomplete=\"email\">."
      limit: "속성 존재·형식 유효성은 자동 검출. 자동완성 실제 동작 여부는 수동 확인 권장."

  - no: 34
    code: "4.2.1"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "웹 애플리케이션 접근성(ARIA)"
    criteria: "웹 애플리케이션은 웹 콘텐츠 기술 표준(ARIA 등)에 따라 접근성이 유지되도록 제공"
    resolver: { type: axe, rules: [aria-required-attr, aria-valid-attr, aria-valid-attr-value, aria-roles, aria-allowed-attr, aria-allowed-role, aria-hidden-focus, aria-required-children, aria-required-parent] }
    guide:
      what: "ARIA role·속성의 유효성, 필수 속성·자식-부모 구조, aria-hidden 요소의 포커스 가능 여부 등을 종합 검사합니다."
      why: "커스텀 위젯(탭, 모달, 콤보박스 등)은 올바른 ARIA 마크업이 없으면 스크린리더가 역할과 상태를 알 수 없습니다."
      basis: "KWCAG 2.2 4.2.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "role에 맞는 필수 aria-* 속성을 제공하고 유효하지 않은 role/속성 조합을 제거. aria-hidden=\"true\" 요소는 포커스 가능하지 않도록 처리."
      limit: "정적 마크업 규칙 위반은 자동 검출. 위젯의 실제 키보드 상호작용 동작은 수동 확인 권장."

  - no: 35
    code: "c-webstandard"
    category: compatibility
    siClassification: auto
    automation: screen
    title: "웹표준 HTML/CSS 준수"
    criteria: "HTML/CSS 문법이 W3C 웹표준을 준수해야 함"
    resolver: { type: markup, rules: [html-standard] }
    guide:
      what: "vnu.jar로 HTML 표준 문법 오류를 확정 검사하고, CSS는 스타일시트 파싱 오류 여부를 스크리닝합니다."
      why: "웹표준을 준수하지 않으면 브라우저·보조기술마다 렌더링이 달라져 호환성 문제가 발생합니다."
      basis: "전자정부 웹사이트 품질관리 가이드 · 웹표준 준수 지침 · W3C HTML/CSS 표준"
      fix: "vnu 오류 목록의 태그·속성 문법을 표준에 맞게 수정하고, CSS 린터로 구문 오류를 제거."
      limit: "HTML은 vnu로 확정 검출. CSS는 문법 스크리닝만 가능하며 렌더링 결과와의 일치 여부는 수동 확인 필요."

  - no: 36
    code: "c-deprecated"
    category: compatibility
    siClassification: auto
    automation: auto
    title: "마크업 오류·Deprecated 태그"
    criteria: "폐기 예정(obsolete) 요소·속성을 사용하지 않아야 함"
    resolver: { type: markup, rules: [obsolete-elements] }
    guide:
      what: "vnu.jar로 <font>, <center>, align 속성 등 HTML에서 폐기된(obsolete) 요소·속성 사용을 검사합니다."
      why: "폐기된 태그는 최신 브라우저·보조기술에서 지원이 중단되어 예기치 않은 렌더링·접근성 문제를 유발합니다."
      basis: "전자정부 웹사이트 품질관리 가이드 · 웹표준 준수 지침 · HTML Living Standard(폐기 요소)"
      fix: "<font> 대신 CSS font-*, <center> 대신 CSS text-align 등 표준 대체 요소·속성으로 치환."
      limit: "vnu로 확정 검출 가능. 서드파티 위젯 내부의 폐기 태그는 소스 접근 제약으로 수동 확인이 필요할 수 있습니다."

  - no: 37
    code: "c-browser"
    category: compatibility
    siClassification: manual
    automation: auto
    title: "브라우저 호환성"
    criteria: "Chromium·Firefox·WebKit 등 주요 엔진에서 동일하게 렌더링·동작"
    resolver: { type: compat, rules: [] }
    guide:
      what: "3개 브라우저 엔진(chromium/firefox/webkit)에서 동일 URL 스크린샷을 캡처해 픽셀 diff로 렌더링 차이를 검사합니다."
      why: "브라우저별 렌더링 차이는 특정 브라우저 사용자에게 레이아웃 깨짐·기능 오작동을 유발합니다."
      basis: "전자정부 웹사이트 품질관리 가이드 · 크로스브라우징 지침 · SIR-003"
      fix: "diff로 검출된 영역의 CSS(벤더 프리픽스, flex/grid 구현 차이 등)를 점검해 크로스브라우저 대응 코드로 보완."
      limit: "픽셀 diff는 threshold 기준 자동 판정. 실제 기능 동작 차이(엔진별 JS 동작 등)는 수동 확인 권장. 네이버 웨일 등 미지원 브라우저는 근사 엔진(엣지=chromium, 사파리=webkit)으로 대체."

  - no: 33
    code: "c-reflow"
    category: compatibility
    siClassification: manual
    automation: auto
    title: "해상도·확대 대응"
    criteria: "1920×1080, 1366×768, 확대 200%에서 UI 깨짐 없이 사용 가능"
    resolver: { type: probe, rules: [reflow-zoom] }
    guide:
      what: "여러 해상도와 200% 확대에서 가로 스크롤·잘림이 없는지 검사합니다."
      why: "저시력 사용자는 화면을 확대해 사용하며, 가로 스크롤이 생기면 읽기 어렵습니다."
      basis: "KWCAG 2.2 대응 · 전자정부 웹사이트 품질관리 가이드 · SIR-004"
      fix: "반응형 레이아웃·상대 단위(%, rem) 사용. 고정 px 폭과 가로 오버플로 제거."
      limit: "가로 오버플로·잘림은 자동 검출. 콘텐츠 가독성 저하는 수동 확인 권장."
