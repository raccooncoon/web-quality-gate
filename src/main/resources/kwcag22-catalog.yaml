      why: "기기를 흔들거나 기울이기 어려운 지체장애 사용자, 거치대 사용자는 동작기반 기능을 이용할 수 없습니다."
      basis: "KWCAG 2.2 2.5.4 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "흔들기로 실행되는 기능에는 버튼 등 일반적인 컨트롤 대체 수단을 함께 제공."
      limit: "이벤트 리스너 등록은 자동 탐지(보조 신호). 실제 기능 대체 수단 제공 여부는 수동 확인 필요."

  - no: 29
    code: "3.2.2"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "찾기 쉬운 도움 정보"
    criteria: "도움말·연락처 등 도움 정보는 각 페이지에서 동일한 상대적 순서로 제공"
    resolver: { type: none }
    guide:
