      why: "손 떨림·한 손 사용자는 멀티터치나 정교한 경로 기반 동작을 수행하기 어렵습니다."
      basis: "KWCAG 2.2 2.5.1 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "핀치줌 대신 확대/축소 버튼을 제공하고, 스와이프 대신 이전/다음 버튼 등 단일 탭 대안을 함께 제공."
      limit: "제스처 필요 여부는 자동 판정이 어려워 스크린샷·시나리오 기반으로 평가자가 수동 확인합니다."

  - no: 26
    code: "2.5.2"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "포인터 입력 취소"
    criteria: "단일 포인터 입력으로 실행되는 기능은 완료 전 취소할 수 있어야 함"
    resolver: { type: probe, rules: [pointer-gesture] }
    guide:
      what: "버튼 클릭이 mousedown/touchstart 시점에 즉시 실행되어 취소 여지가 없는지 스크린샷·동작 기록으로 확인합니다."
      why: "운동 조절이 어려운 사용자는 실수로 누른 입력을 취소할 기회가 필요합니다."
      basis: "KWCAG 2.2 2.5.2 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "down 이벤트가 아닌 click(up) 이벤트에서 기능을 실행하고, 필요 시 확인 단계를 추가."
      limit: "이벤트 바인딩 방식은 코드 검토가 필요해 자동 판정 도구의 한계로 수동 확인합니다."

  - no: 27
    code: "2.5.3"
    category: accessibility
    siClassification: manual
    automation: auto
    title: "레이블과 네임"
    criteria: "화면에 보이는 레이블 텍스트가 접근성 이름에도 포함되어야 함"
    resolver: { type: axe, rules: [label-content-name-mismatch] }
    guide:
      what: "화면에 표시된 버튼/링크 텍스트와 접근성 트리상의 accessible name이 일치하는지 검사합니다."
      why: "음성 인식 사용자는 화면에 보이는 문구를 그대로 말해 조작하므로, 이름이 다르면 명령이 인식되지 않습니다."
      basis: "KWCAG 2.2 2.5.3 · 장애인차별금지법 · KS X OT0003:2022"
      fix: "aria-label을 별도로 쓸 경우 화면에 보이는 텍스트를 포함하도록 작성. 예) 보이는 텍스트 \"저장\" → aria-label=\"저장하기\"(포함 O)."
      limit: "텍스트 불일치는 자동 검출. 시각적으로 숨겨진 추가 설명의 적절성은 수동 확인 권장."

  - no: 28
    code: "2.5.4"
    category: accessibility
    siClassification: manual
    automation: manual
    title: "동작 기반 작동"
    criteria: "흔들기·기울이기 등 동작기반 기능은 일반 컨트롤 대체수단을 제공"
    resolver: { type: probe, rules: [devicemotion] }
